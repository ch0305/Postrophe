name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    name: Build Debian package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build sassc gettext itstool \
            libhandy-1-dev libgirepository1.0-dev libgtk-3-dev \
            desktop-file-utils libglib2.0-bin

      - name: Run unit tests
        run: /usr/bin/python3 -m unittest tests.test_task_list

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n "s/^  version: '\([^']*\)',/\1/p" meson.build | head -n1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match meson.build version $version" >&2
            exit 1
          fi

      - name: Build the .deb
        run: ./make-deb.sh

      - name: Show package information
        run: |
          ls -lh postrophe_*.deb
          dpkg-deb -I postrophe_*.deb

      - name: Upload the package as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: postrophe-deb
          path: postrophe_*.deb
          if-no-files-found: error

      - name: Publish a GitHub Release for tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: postrophe_*.deb
          generate_release_notes: true

      - name: Update the rolling "latest" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Rolling build of the latest main commit (${GITHUB_SHA:0:7})."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest postrophe_*.deb --clobber
            gh release edit latest --notes "$notes"
          else
            gh release create latest postrophe_*.deb \
              --prerelease \
              --title "Latest build" \
              --notes "$notes"
          fi
